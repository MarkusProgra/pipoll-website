<!-- Add inside navbar -->
<div class="nav-right-group">
    <button class="blog-admin-btn" id="adminLoginBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1l3 6 6 .9-4.5 4.3 1 6.3L12 15l-5.5 3.5 1-6.3L3 7.9 9 7z"/>
        </svg>
        Admin
    </button>
</div>

<!-- Add before closing body -->
<div class="modal-overlay" id="adminModal">
    <div class="modal-card">
        <button class="modal-close" id="closeAdminModal">✕</button>

        <div class="modal-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0110 0v4"></path>
            </svg>
        </div>

        <h2 class="modal-title">Admin Access</h2>

        <p class="modal-subtitle">
            Enter the Pipoll admin password to manage and publish blog posts.
        </p>

        <form class="modal-form" id="adminLoginForm">
            <input
                type="password"
                class="modal-input"
                id="adminPassword"
                placeholder="Enter password"
                autocomplete="off"
            >

            <button type="submit" class="modal-submit">
                Enter Admin Mode
            </button>

            <div class="modal-input-error" id="loginError">
                Incorrect password.
            </div>
        </form>
    </div>
</div>

<section class="admin-panel" id="adminPanel" style="display:none;">
    <div class="admin-header">
        <div class="admin-header-left">
            <div class="admin-logo">
                <img src="logo.png" alt="Pipoll" class="logo-img">

                <div>
                    <h2>Blog CMS</h2>
                    <span class="admin-badge">Admin Mode</span>
                </div>
            </div>

            <div class="admin-stats">
                <div class="admin-stat">
                    <span class="admin-stat-val" id="postCount">0</span>
                    <span class="admin-stat-label">Posts</span>
                </div>
            </div>
        </div>

        <div class="admin-header-right">
            <button class="admin-new-btn" id="newPostBtn">
                + New Blog Post
            </button>

            <button class="admin-logout-btn" id="logoutBtn">
                Exit Admin
            </button>
        </div>
    </div>

    <div class="post-editor" id="postEditor" style="display:none;">
        <div class="editor-header">
            <h2>Create Blog Post</h2>

            <div class="editor-actions">
                <button class="editor-back-btn" id="cancelEditorBtn">
                    Cancel
                </button>

                <button class="editor-publish-btn" id="publishPostBtn">
                    Publish Post
                </button>
            </div>
        </div>

        <div class="editor-body">
            <div class="editor-main">
                <div class="editor-field">
                    <label class="editor-label">Blog Heading</label>

                    <input
                        type="text"
                        class="editor-input editor-title-input"
                        id="postTitle"
                        placeholder="The future of the human economy"
                    >
                </div>

                <div class="editor-field">
                    <label class="editor-label">Blog Content</label>

                    <textarea
                        class="editor-textarea"
                        id="postContent"
                        rows="18"
                        placeholder="Write your blog post here..."
                    ></textarea>
                </div>
            </div>

            <div class="editor-sidebar">
                <div class="editor-sidebar-section">
                    <label class="editor-sidebar-title">
                        Cover Image
                    </label>

                    <div class="cover-upload-area" id="coverUploadArea">
                        <input
                            type="file"
                            id="coverImageInput"
                            accept="image/*"
                            hidden
                        >

                        <div class="cover-upload-placeholder">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>

                            <span>Upload Cover Image</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
const ADMIN_PASSWORD = 'Pipoll_Blog_2026';

const adminBtn = document.getElementById('adminLoginBtn');
const adminModal = document.getElementById('adminModal');
const closeModal = document.getElementById('closeAdminModal');
const loginForm = document.getElementById('adminLoginForm');
const passwordInput = document.getElementById('adminPassword');
const loginError = document.getElementById('loginError');
const adminPanel = document.getElementById('adminPanel');
const newPostBtn = document.getElementById('newPostBtn');
const postEditor = document.getElementById('postEditor');
const cancelEditorBtn = document.getElementById('cancelEditorBtn');
const publishPostBtn = document.getElementById('publishPostBtn');
const logoutBtn = document.getElementById('logoutBtn');
const postCount = document.getElementById('postCount');
const coverUploadArea = document.getElementById('coverUploadArea');
const coverImageInput = document.getElementById('coverImageInput');

let uploadedImage = '';
let blogPosts = JSON.parse(localStorage.getItem('pipoll_blog_posts') || '[]');

updatePostCount();
renderPosts();

adminBtn.addEventListener('click', () => {
    adminModal.classList.add('active');
});

closeModal.addEventListener('click', () => {
    adminModal.classList.remove('active');
});

adminModal.addEventListener('click', (e) => {
    if (e.target === adminModal) {
        adminModal.classList.remove('active');
    }
});

loginForm.addEventListener('submit', (e) => {
    e.preventDefault();

    if (passwordInput.value === ADMIN_PASSWORD) {
        adminModal.classList.remove('active');
        adminPanel.style.display = 'block';
        loginError.style.display = 'none';

        setTimeout(() => {
            adminPanel.scrollIntoView({ behavior: 'smooth' });
        }, 150);
    } else {
        loginError.style.display = 'block';
    }
});

newPostBtn.addEventListener('click', () => {
    postEditor.style.display = 'block';

    setTimeout(() => {
        postEditor.scrollIntoView({ behavior: 'smooth' });
    }, 100);
});

cancelEditorBtn.addEventListener('click', () => {
    postEditor.style.display = 'none';
});

logoutBtn.addEventListener('click', () => {
    adminPanel.style.display = 'none';
    postEditor.style.display = 'none';
});

coverUploadArea.addEventListener('click', () => {
    coverImageInput.click();
});

coverImageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {
        uploadedImage = event.target.result;

        coverUploadArea.innerHTML = `
            <img
                src="${uploadedImage}"
                style="width:100%;height:100%;object-fit:cover;"
            >
        `;
    };

    reader.readAsDataURL(file);
});

publishPostBtn.addEventListener('click', () => {
    const title = document.getElementById('postTitle').value.trim();
    const content = document.getElementById('postContent').value.trim();

    if (!title || !content || !uploadedImage) {
        alert('Please complete all fields and upload an image.');
        return;
    }

    const newPost = {
        id: Date.now(),
        title,
        content,
        image: uploadedImage,
        date: new Date().toLocaleDateString(),
        readTime: Math.max(1, Math.ceil(content.split(' ').length / 180)) + ' min read'
    };

    blogPosts.unshift(newPost);

    localStorage.setItem('pipoll_blog_posts', JSON.stringify(blogPosts));

    updatePostCount();
    renderPosts();

    document.getElementById('postTitle').value = '';
    document.getElementById('postContent').value = '';

    uploadedImage = '';

    postEditor.style.display = 'none';
});

function updatePostCount() {
    postCount.textContent = blogPosts.length;
}

function renderPosts() {
    const blogGrid = document.getElementById('blogGrid');

    if (!blogGrid) return;

    blogGrid.innerHTML = '';

    blogPosts.forEach(post => {
        const article = document.createElement('article');

        article.className = 'blog-card';

        article.innerHTML = `
            <div class="blog-card-image-wrap">
                <img src="${post.image}" class="blog-card-image">

                <div class="blog-card-category">
                    Pipoll
                </div>
            </div>

            <div class="blog-card-content">
                <div class="blog-card-meta">
                    <span>${post.date}</span>
                    <span>${post.readTime}</span>
                </div>

                <h3 class="blog-card-title">
                    ${post.title}
                </h3>

                <p class="blog-card-excerpt">
                    ${post.content.substring(0, 180)}...
                </p>
            </div>
        `;

        blogGrid.appendChild(article);
    });
}
</script>
