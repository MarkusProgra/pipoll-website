<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pipoll Blog</title>

    <link rel="stylesheet" href="blog-styles.css">

</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="#" class="logo">
                Pipoll
            </a>

            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Blog</a>
                <a href="#">About</a>
            </div>

            <button class="blog-admin-btn" id="adminLoginBtn">
                Admin
            </button>

        </div>

    </nav>

    <section class="blog-hero">

        <div class="blog-hero-content">

            <div class="blog-badge">
                Pipoll Editorial
            </div>

            <h1 class="blog-title">
                The Future Of Human Thinking
            </h1>

            <p class="blog-subtitle">
                Ideas, innovation, philosophy, economics and the future of humanity.
            </p>

        </div>

    </section>

    <section class="blog-posts-section">

        <div class="blog-posts-container">

            <div class="blog-grid" id="blogGrid"></div>

        </div>

    </section>

    <!-- ADMIN MODAL -->

    <div class="modal-overlay" id="adminModal">

        <div class="modal-card">

            <button class="modal-close" id="closeAdminModal">
                ✕
            </button>

            <h2 class="modal-title">
                Admin Access
            </h2>

            <p class="modal-subtitle">
                Enter the Pipoll admin password.
            </p>

            <form class="modal-form" id="adminLoginForm">

                <input
                    type="password"
                    class="modal-input"
                    id="adminPassword"
                    placeholder="Enter password"
                    autocomplete="off"
                >

                <button type="submit" class="modal-submit">
                    Enter Admin Mode
                </button>

                <div class="modal-input-error" id="loginError">
                    Incorrect password.
                </div>

            </form>

        </div>

    </div>

    <script>

        const ADMIN_PASSWORD = 'Pipoll_Blog_2026';

        const adminBtn = document.getElementById('adminLoginBtn');
        const adminModal = document.getElementById('adminModal');
        const closeModal = document.getElementById('closeAdminModal');
        const loginForm = document.getElementById('adminLoginForm');
        const passwordInput = document.getElementById('adminPassword');
        const loginError = document.getElementById('loginError');

        adminBtn.addEventListener('click', () => {

            adminModal.classList.add('active');

        });

        closeModal.addEventListener('click', () => {

            adminModal.classList.remove('active');

        });

        adminModal.addEventListener('click', (e) => {

            if (e.target === adminModal) {

                adminModal.classList.remove('active');

            }

        });

        loginForm.addEventListener('submit', (e) => {

            e.preventDefault();

            if (passwordInput.value === ADMIN_PASSWORD) {

                loginError.style.display = 'none';

                localStorage.setItem('pipoll_admin', 'true');

                window.location.href = 'admin.html';

            } else {

                loginError.style.display = 'block';

            }

        });

        function renderPosts() {

            const blogGrid = document.getElementById('blogGrid');

            const posts = JSON.parse(localStorage.getItem('pipoll_blog_posts') || '[]');

            if (posts.length === 0) {

                blogGrid.innerHTML = `
                
                    <div class="empty-state">

                        <h2>No blog posts yet</h2>

                        <p>
                            Enter admin mode to create your first article.
                        </p>

                    </div>
                
                `;

                return;

            }

            blogGrid.innerHTML = '';

            posts.forEach(post => {

                const article = document.createElement('article');

                article.className = 'blog-card';

                article.innerHTML = `
                
                    <div class="blog-card-image-wrap">

                        <img src="${post.image}" class="blog-card-image">

                    </div>

                    <div class="blog-card-content">

                        <div class="blog-card-meta">

                            <span>${post.date}</span>

                        </div>

                        <h3 class="blog-card-title">

                            ${post.title}

                        </h3>

                        <p class="blog-card-excerpt">

                            ${post.content.substring(0, 180)}...

                        </p>

                    </div>

                `;

                blogGrid.appendChild(article);

            });

        }

        renderPosts();

    </script>

</body>
</html>
